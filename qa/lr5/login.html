<!doctype html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="Вход в личный кабинет кофейни «Зерно»" />
        <title>Вход — Кофейня «Зерно»</title>
        <link rel="stylesheet" href="/src/style.css" />
    </head>
    <body>
        <header class="header">
            <a class="logo" href="/">Кофейня «Зерно»</a>
        </header>
        <main class="auth">
            <h1>Вход</h1>
            <form id="login-form" novalidate>
                <label for="email">Email</label>
                <input id="email" name="email" type="email" autocomplete="email" required />

                <label for="password">Password</label>
                <input
                    id="password"
                    name="password"
                    type="password"
                    autocomplete="current-password"
                    required
                />

                <div id="login-error" class="error" role="alert" hidden></div>

                <button type="submit">Войти</button>
            </form>
            <p class="hint">Демо: user@example.com / password123</p>
        </main>
        <script type="module" src="/src/login.js"></script>
    </body>
</html>
